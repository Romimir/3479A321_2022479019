name: lab1
description: "A new Flutter project."
version: 1.0.0+1

environment:
  sdk: ^3.13.0
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  logger: ^2.8.0
  provider: ^6.1.5+1
  audioplayers: ^6.8.1
  sensors_plus: ^7.1.1
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/icono.png"
  min_sdk_android: 21

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/audio/

  fonts:
    - family: MatchaCih
      fonts:
      - asset: assets/fonts/Matcha Cih.ttf
        weight: 700